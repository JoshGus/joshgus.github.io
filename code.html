body{font-size:17px;line-height:1.6}

.page-header p{font-family:var(--body);font-size:1.05rem;margin-top:20px;max-width:560px;line-height:1.7}

.projects{padding:0 clamp(20px,5vw,72px) 100px}

/* year marker */
.year-mark{font-family:var(--disp);font-weight:500;font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-.02em;
  font-variation-settings:"opsz" 48;padding:52px 0 12px;border-bottom:1px solid var(--line-strong)}
.year-mark:first-child{padding-top:30px}

/* project row: the date sits in the left column, on a rail that runs the
   length of the list with one dot per project (filled if still going) */
.project{position:relative;border-bottom:1px solid var(--line);padding:0;overflow:hidden;--when:8.5rem}
.project::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--when) + 10px);width:1px;background:var(--line-strong)}
.project-head{display:grid;grid-template-columns:var(--when) 1fr auto;align-items:start;gap:20px;
  padding:28px 0;cursor:pointer;transition:background .2s}
.project-head:hover .proj-title{color:var(--accent-ink)}
.proj-when{position:relative;font-family:var(--mono);font-size:.74rem;color:var(--dim);padding-top:7px}
.proj-when::after{content:"";position:absolute;right:-15px;top:11px;width:9px;height:9px;border-radius:50%;
  box-sizing:border-box;background:var(--bg);border:2px solid var(--accent-ink)}
.project.ongoing .proj-when::after{background:var(--accent-ink)}
.project.ongoing .proj-when{color:var(--accent-ink)}
.proj-title{font-family:var(--disp);font-weight:500;font-size:clamp(1.15rem,2.4vw,1.6rem);letter-spacing:-.02em;
  font-variation-settings:"opsz" 36;transition:color .2s}
.proj-subtitle{font-family:var(--body);font-size:0.91rem;
  color:var(--dimmer);margin-top:6px}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-family:var(--body);font-size:0.75rem;
  border:1px solid var(--line-strong);padding:4px 9px;color:var(--dim)}
.proj-arrow{font-family:var(--mono);font-size:.8rem;color:var(--dimmer);padding-top:4px;
  transition:transform .3s,color .2s}
.project.open .proj-arrow{transform:rotate(90deg);color:var(--accent-ink)}

/* expand panel */
.project-body{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.2,.7,.3,1)}
.project.open .project-body{max-height:900px}
.project-detail{padding:0 0 32px calc(var(--when) + 20px);display:grid;grid-template-columns:1fr 240px;gap:32px}
.detail-desc{font-size:1rem;line-height:1.75;color:var(--dim)}
.detail-desc strong{color:var(--fg)}
.detail-meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--dim)}
.detail-meta dt{color:var(--dimmer);font-size:0.8rem;margin-top:14px;margin-bottom:3px}
.detail-meta dt:first-child{margin-top:0}
.detail-meta dd{color:var(--fg)}
.detail-links{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.dlink{font-family:var(--body);font-size:0.86rem;
  border:1px solid var(--line-strong);padding:8px 14px;color:var(--accent-ink);transition:all .2s}
.dlink:hover{background:var(--accent-ink);color:var(--bg);border-color:var(--accent-ink)}
/* phones: the date moves above the title and the rail runs down the left edge */
@media(max-width:640px){
  .project{padding-left:18px}
  .project::before{left:4px}
  .project-head{grid-template-columns:1fr auto;gap:4px 12px}
  .proj-when{grid-column:1 / -1;padding-top:0}
  .proj-when::after{right:auto;left:-18px;top:4px}
  .project-detail{grid-template-columns:1fr;padding-left:0}
}
</style>

function render() {
  const wrap = document.getElementById('projects');
  let year = null;
  [...PROJECTS].sort((a, b) => (a.start < b.start ? 1 : -1)).forEach(p => {
    const y = p.start.slice(0, 4);
    if (y !== year) {
      year = y;
      const mark = document.createElement('div');
      mark.className = 'year-mark';
      mark.textContent = y;
      wrap.appendChild(mark);
    }
    const section = document.createElement('div');
    section.className = 'project' + (p.ongoing ? ' ongoing' : '');
    section.innerHTML = `
      <div class="project-head">
        <span class="proj-when">${p.when}</span>
        <div>
          <div class="proj-title">${p.title}</div>
          <div class="proj-subtitle">${p.subtitle}</div>
          <div class="proj-tags">${p.tags.map(t => '<span class="tag">'+t+'</span>').join('')}</div>
        </div>
        <span class="proj-arrow">&#9656;</span>
      </div>
      <div class="project-body">
        <div class="project-detail">
          <p class="detail-desc">${p.desc}</p>
          <dl class="detail-meta">
            <dt>Role</dt><dd>${p.role}</dd>
            <dt>Stack</dt><dd>${p.stack}</dd>
            <dt>When</dt><dd>${p.when}</dd>
            ${p.links.length ? '<dt>Links</dt><dd><div class="detail-links">'+p.links.map(l=>'<a href="'+l.href+'" class="dlink"'+(/^https?:/.test(l.href)?' target="_blank" rel="noopener"':'')+'>'+l.label+'</a>').join('')+'</div></dd>' : ''}
          </dl>
        </div>
      </div>`;
    section.querySelector('.project-head').addEventListener('click', () => {
      section.classList.toggle('open');
    });
    wrap.appendChild(section);
  });
}
